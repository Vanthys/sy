<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   width="512"
   height="512"
   viewBox="0 0 512 512"
   fill="none"
   role="img"
   aria-labelledby="title desc"
   version="1.1"
   id="svg6"
   sodipodi:docname="icon.svg"
   inkscape:version="1.4.2 (f4327f4, 2025-05-13)"
   xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
   xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:svg="http://www.w3.org/2000/svg"
   xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#"
   xmlns:cc="http://creativecommons.org/ns#"
   xmlns:dc="http://purl.org/dc/elements/1.1/">
  <sodipodi:namedview
     id="namedview6"
     pagecolor="#505050"
     bordercolor="#eeeeee"
     borderopacity="1"
     inkscape:showpageshadow="0"
     inkscape:pageopacity="0"
     inkscape:pagecheckerboard="0"
     inkscape:deskcolor="#505050"
     inkscape:zoom="0.80957031"
     inkscape:cx="40.144753"
     inkscape:cy="222.95778"
     inkscape:window-width="1920"
     inkscape:window-height="1009"
     inkscape:window-x="2872"
     inkscape:window-y="-8"
     inkscape:window-maximized="1"
     inkscape:current-layer="svg6" />
  <title
     id="title">The Cycle Rune</title>
  <desc
     id="desc">A minimalist emblem with a broken circular ring and angular cyclical spokes, designed for an ancient-modern aesthetic.</desc>
  <!-- Theme (edit these) -->
  <style
     id="style1">
    :root {
      --line: #00E5FF;   /* main stroke color */
      --glow: #00E5FF;   /* glow color */
      --strokeOuter: 18; /* outer ring width */
      --strokeInner: 22; /* inner glyph width */
    }
    .ring { stroke: var(--line); stroke-width: var(--strokeOuter); fill: none; stroke-linecap: round; }
    .sig  { stroke: var(--line); stroke-width: var(--strokeInner); fill: none; stroke-linecap: round; stroke-linejoin: bevel; }
    /* Toggle glow: set filter to none if you want a flat, fully modern look */
    .glow { filter: url(#glowFilter); }
  </style>
  <defs
     id="defs2">
    <!-- Soft inner-glow for the 'ancient tech' feel -->
    <filter
       id="glowFilter"
       x="-0.0371852"
       y="-0.0371852"
       width="1.0743704"
       height="1.0743704">
      <feGaussianBlur
         in="SourceGraphic"
         stdDeviation="1.367605"
         result="blur1"
         id="feGaussianBlur1" />
      <feMerge
         id="feMerge2">
        <feMergeNode
           in="blur1"
           id="feMergeNode1" />
        <feMergeNode
           in="SourceGraphic"
           id="feMergeNode2" />
      </feMerge>
    </filter>
  </defs>
  <!-- Work in a centered coordinate system -->
  <g
     transform="matrix(1.4428064,0,0,1.4428064,256,256)"
     class="glow"
     id="g6"
     style="fill:none;stroke:#00e5ff;stroke-width:18;stroke-opacity:1;filter:url(#glowFilter)">
    <!-- Broken outer ring: two opposing arcs with gaps -->
    <!-- Using dasharray to create “carved” breaks -->
    <circle
       r="165.14973"
       class="ring"
       stroke-dasharray="83%"
       id="circle2"
       style="fill:none;stroke:#00e5ff;stroke-width:18;stroke-opacity:1"
       cx="0"
       cy="0" />
    <!-- Mid guide ring (subtle, optional). Comment out to simplify further. -->
    <circle
       r="123.8623"
       class="ring"
       opacity="0.25"
       stroke-dasharray="120 30"
       transform="rotate(45)"
       id="circle4"
       style="fill:none;stroke:#00e5ff;stroke-width:18;stroke-opacity:1"
       cx="0"
       cy="0" />
    <!-- Angular cyclical spokes forming a rotating, rune-like loop -->
    <!-- Base arm: a right-angled path that implies motion inward, then turn -->
    <g
       id="arm"
       style="fill:none;stroke:#00e5ff;stroke-width:21.7984;stroke-dasharray:none;stroke-opacity:1"
       transform="scale(0.82574869)">
      <!-- Edit these coordinates to tweak “sharpness” -->
      <path
         d="M 110,-12 H 48 v -68"
         class="sig"
         id="path4"
         style="fill:none;stroke:#00e5ff;stroke-width:21.7984;stroke-dasharray:none;stroke-opacity:1" />
    </g>
    <use
       href="#arm"
       transform="rotate(90)"
       id="use4"
       style="fill:none;stroke:#00e5ff;stroke-width:18;stroke-dasharray:none;stroke-opacity:1" />
    <use
       href="#arm"
       transform="scale(-1)"
       id="use5"
       style="fill:none;stroke:#00e5ff;stroke-width:18;stroke-dasharray:none;stroke-opacity:1" />
    <use
       href="#arm"
       transform="rotate(-90)"
       id="use6"
       style="fill:none;stroke:#00e5ff;stroke-width:18;stroke-dasharray:none;stroke-opacity:1" />
    <!-- Core circle to suggest focus/continuity -->
    <circle
       r="34.681446"
       class="sig"
       id="circle6"
       style="fill:none;stroke:#00e5ff;stroke-width:18;stroke-dasharray:none;stroke-opacity:1"
       cx="0"
       cy="0" />
  </g>
  <metadata
     id="metadata6">
    <rdf:RDF>
      <cc:Work
         rdf:about="">
        <dc:title>The Cycle Rune</dc:title>
      </cc:Work>
    </rdf:RDF>
  </metadata>
</svg>
